name: Build SKYFLOW M Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-release:
    name: Build release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # Node 20 EOL on Actions runners; opt into Node 24 for JS-based actions.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ANDROID_MIN_API: "29"
      ANDROID_COMPILE_SDK: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK_VERSION: "27.2.12479018"
      SERVER_BINARY_NAME: "server"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: go_client/go.sum

      - name: Generate Go sums
        shell: bash
        run: |
          set -euo pipefail

          echo "== Root Go module =="
          go mod tidy

          echo "== Go client module =="
          cd go_client
          go mod tidy

      - name: Build Android libclient from go_client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86_64
          mkdir -p build/go-client

          cd go_client
          build_client() {
            local goos="$1"
            local goarch="$2"
            local out="$3"
            echo "== Build client ${goos}/${goarch} =="
            if [[ "$goarch" == "arm" ]]; then
              local cc="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi${ANDROID_MIN_API}-clang"
              if [[ ! -x "$cc" ]]; then
                echo "NDK clang not found: $cc"
                exit 1
              fi
              CGO_ENABLED=1 GOOS="$goos" GOARCH="$goarch" CC="$cc" \
                go build -trimpath -ldflags="-s -w -checklinkname=0" -o "../${out}" .
            elif [[ "$goarch" == "amd64" ]]; then
              local cc="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android${ANDROID_MIN_API}-clang"
              if [[ ! -x "$cc" ]]; then
                echo "NDK clang not found: $cc"
                exit 1
              fi
              CGO_ENABLED=1 GOOS="$goos" GOARCH="$goarch" CC="$cc" \
                go build -trimpath -ldflags="-s -w -checklinkname=0" -o "../${out}" .
            else
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                go build -trimpath -ldflags="-s -w -checklinkname=0" -o "../${out}" .
            fi
            chmod +x "../${out}"
          }

          build_client android arm64 app/src/main/jniLibs/arm64-v8a/libclient.so
          build_client android arm app/src/main/jniLibs/armeabi-v7a/libclient.so
          build_client android amd64 app/src/main/jniLibs/x86_64/libclient.so

          cp ../app/src/main/jniLibs/arm64-v8a/libclient.so ../build/go-client/libclient-arm64-v8a.so
          cp ../app/src/main/jniLibs/armeabi-v7a/libclient.so ../build/go-client/libclient-armeabi-v7a.so
          cp ../app/src/main/jniLibs/x86_64/libclient.so ../build/go-client/libclient-x86_64.so

          echo "Built JNI libraries:"
          find ../app/src/main/jniLibs -type f -name "libclient.so" -exec ls -lh {} \;

      - name: Build speed-mode native libraries (Xray + hev-socks5-tunnel)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-native-speed.sh
          ANDROID_NDK_HOME="${ANDROID_NDK_HOME}" ANDROID_MIN_API="${ANDROID_MIN_API}" \
            ./scripts/build-native-speed.sh
          echo "Speed-mode native libraries:"
          find app/src/main/jniLibs -type f \( -name "libxray.so" -o -name "libhev-socks5-tunnel.so" \) -exec ls -lh {} \;

      - name: Build Linux server binaries
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/server

          echo "== Build server linux/amd64 =="
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build \
              -trimpath \
              -ldflags="-s -w -checklinkname=0" \
              -o build/server/wdtt-server-linux-amd64 \
              ./server.go

          echo "== Build server linux/arm64 =="
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build \
              -trimpath \
              -ldflags="-s -w -checklinkname=0" \
              -o build/server/wdtt-server-linux-arm64 \
              ./server.go

          chmod +x build/server/wdtt-server-linux-amd64
          chmod +x build/server/wdtt-server-linux-arm64

      - name: Put server binary into Android assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets

          # Android deploy code expects this exact asset name.
          cp build/server/wdtt-server-linux-amd64 app/src/main/assets/${SERVER_BINARY_NAME}
          chmod +x app/src/main/assets/${SERVER_BINARY_NAME}

          echo "Server asset:"
          ls -lh app/src/main/assets/${SERVER_BINARY_NAME}

      - name: Download Xray geo data (geoip.dat + geosite.dat)
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets

          BASE_URL="https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download"
          for name in geoip.dat geosite.dat; do
            echo "Downloading $name..."
            curl -fsSL "${BASE_URL}/${name}" -o "app/src/main/assets/${name}"
          done

          echo "Geo data sizes:"
          ls -lh app/src/main/assets/geoip.dat app/src/main/assets/geosite.dat

      - name: Cache Gradle distributions and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Build Android release APK
        shell: bash
        run: |
          set -euo pipefail

          # Gradle подписывает APK автоматически через skyflow-release.keystore
          # (лежит в репо, пароль/алиас захардкожены в build.gradle.kts).
          # Это гарантирует одинаковую подпись у CI и локальных сборок —
          # пользователь может устанавливать обновления без удаления приложения.
          ./gradlew clean :app:assembleRelease --stacktrace

      - name: Collect build outputs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/artifacts/apk
          mkdir -p build/artifacts/server
          mkdir -p build/artifacts/go-client

          echo "== Release APK outputs =="
          find app/build/outputs/apk/release -type f -name "*.apk" -print -exec ls -lh {} \;

          cp app/build/outputs/apk/release/*.apk build/artifacts/apk/
          cp build/server/* build/artifacts/server/
          cp build/go-client/* build/artifacts/go-client/

          echo "== Final artifacts =="
          find build/artifacts -type f -exec ls -lh {} \;

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | grep -oP '"\K[^"]+')
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION}"

      - name: Rename APK to skyflow-m.apk
        shell: bash
        run: |
          APK=$(ls build/artifacts/apk/*.apk | head -1)
          mv "$APK" build/artifacts/apk/skyflow-m.apk
          echo "APK: $(ls -lh build/artifacts/apk/skyflow-m.apk)"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SKYFLOW M ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          files: build/artifacts/apk/skyflow-m.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: SKYFLOW-M-release-apk
          path: build/artifacts/apk/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload server binaries artifact
        uses: actions/upload-artifact@v6
        with:
          name: SKYFLOW-M-server-binaries
          path: build/artifacts/server/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload Go client libraries artifact
        uses: actions/upload-artifact@v6
        with:
          name: SKYFLOW-M-go-client-libraries
          path: build/artifacts/go-client/*
          if-no-files-found: error
          retention-days: 7
