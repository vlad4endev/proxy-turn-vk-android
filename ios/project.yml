name: SkyflowVPN
options:
  bundleIdPrefix: com.wdtt.client
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  usesTabs: false
  indentWidth: 4

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "120"
    DEVELOPMENT_TEAM: ""          # ← вставь свой Team ID
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:

  # ─── Main App ─────────────────────────────────────────────────────────────
  SkyflowVPN:
    type: application
    platform: iOS
    bundleIdSuffix: ""
    info:
      path: SkyflowVPN/Resources/Info.plist
      properties:
        CFBundleDisplayName: SKYFLOW VPN
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSUserTrackingUsageDescription: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: SkyflowVPN/SkyflowVPN.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wdtt.client
        INFOPLIST_FILE: SkyflowVPN/Resources/Info.plist
        # XCFrameworks are added via OTHER_LDFLAGS once built:
        # scripts/build-native-ios.sh → SkyflowVPN/Frameworks/
    sources:
      - path: SkyflowVPN/App
      - path: SkyflowVPN/UI
      - path: SkyflowVPN/Core
    resources:
      - path: SkyflowVPN/Resources/Assets.xcassets
    dependencies:
      - target: SkyflowTunnel
        embed: true
    preBuildScripts:
      - name: SwiftLint (optional)
        script: |
          if which swiftlint > /dev/null; then
            swiftlint
          fi
        showEnvVars: false

  # ─── Network Extension ────────────────────────────────────────────────────
  SkyflowTunnel:
    type: app-extension
    platform: iOS
    info:
      path: SkyflowTunnel/Info.plist
    entitlements:
      path: SkyflowTunnel/SkyflowTunnel.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wdtt.client.tunnel
        INFOPLIST_FILE: SkyflowTunnel/Info.plist
    sources:
      - path: SkyflowTunnel
        excludes:
          - Info.plist
          - "*.entitlements"

schemes:
  SkyflowVPN:
    build:
      targets:
        SkyflowVPN: all
        SkyflowTunnel: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
